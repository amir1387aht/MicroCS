; Explicit opt-in cross-builds, NOT default firmware or hardware test results.
; Pass absolute paths in MICROCS_SOURCE_ROOT / MICROCS_TFT_ROOT / MICROCS_LVGL{8,9}_ROOT.
[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
lib_ldf_mode = chain
build_flags =
  -DMCS_ENABLE_TFT_ESPI=1
  -DMCS_ENABLE_THREADS=0
  -DMCS_ENABLE_WS2812=0
  -DMCS_ENABLE_SERVO=0
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=23
  -DTFT_MISO=19
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=2
  -DTFT_RST=4
  -DSPI_FREQUENCY=27000000
  -DLOAD_GLCD=1
lib_deps =
  symlink://${sysenv.MICROCS_TFT_ROOT}
  symlink://${sysenv.MICROCS_SOURCE_ROOT}

[env:tft-standalone]

[env:tft-lvgl8]
lib_deps =
  ${env.lib_deps}
  symlink://${sysenv.MICROCS_LVGL8_ROOT}
build_flags =
  ${env.build_flags}
  -DMCS_ENABLE_LVGL=1
  -DMCS_LVGL_MAJOR=8
  -DLV_CONF_INCLUDE_SIMPLE=1
  -I${PROJECT_DIR}/configs/lvgl8

[env:tft-lvgl9]
lib_deps =
  ${env.lib_deps}
  symlink://${sysenv.MICROCS_LVGL9_ROOT}
build_flags =
  ${env.build_flags}
  -DMCS_ENABLE_LVGL=1
  -DMCS_LVGL_MAJOR=9
  -DLV_CONF_INCLUDE_SIMPLE=1
  -I${PROJECT_DIR}/configs/lvgl9

[env:tft-touch-lvgl9]
extends = env:tft-lvgl9
build_flags =
  ${env:tft-lvgl9.build_flags}
  -DTOUCH_CS=15
  -DSPI_TOUCH_FREQUENCY=2500000

[env:graphics-off]
build_flags =
  -DMCS_ENABLE_TFT_ESPI=0
  -DMCS_ENABLE_LVGL=0
  -DMCS_ENABLE_THREADS=0
  -DMCS_ENABLE_WS2812=0
  -DMCS_ENABLE_SERVO=0
lib_deps = symlink://${sysenv.MICROCS_SOURCE_ROOT}
