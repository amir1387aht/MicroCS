# Real C# threads on Zephyr threads (docs/THREADS.md):
#   west build -b <board> ports/zephyr/example -- -DEXTRA_CONF_FILE=overlay-threads.conf
CONFIG_MICROCS_THREADS=y
# thread stacks (MCS_THREAD_STACK, 8 KB each) and channel buffers come from the system heap
CONFIG_HEAP_MEM_POOL_SIZE=40960
# thread VM heaps (MCS_THREAD_HEAP, 32 KB; 64 KB on native_sim/native/64) come from the C# heap
CONFIG_MICROCS_HEAP_SIZE=131072
