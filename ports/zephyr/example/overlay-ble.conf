# Bluetooth LE for C# (Ble, BleService, BleConnection, BleUart; docs/BLE.md):
#   west build -b nrf52840dk/nrf52840 ports/zephyr/example -- -DEXTRA_CONF_FILE=overlay-ble.conf
# Not part of the release firmware.
CONFIG_BT=y
CONFIG_MICROCS_BLE=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_SMP=y
CONFIG_BT_FIXED_PASSKEY=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_DEVICE_NAME="MicroCS"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_APPEARANCE_DYNAMIC=y
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4
# 247-byte ATT MTU, long reads / writes
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_ATT_PREPARE_COUNT=4
# the GATT callbacks copy values on the Bluetooth threads
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# bonds across resets: CONFIG_BT_SETTINGS=y + CONFIG_SETTINGS=y + a settings backend
# (CONFIG_NVS / CONFIG_ZMS on its own partition)
