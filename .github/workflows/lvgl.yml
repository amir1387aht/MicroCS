name: Optional host-owned LVGL
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled-overhead:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Generated binding, test cases and reference stay in sync
        run: |
          python3 tools/gen_lvgl_api.py --check
          python3 tests/lvgl/test_sanitizer_log.py
      - name: No LVGL dependency, runtime symbols, VM memory or VM/capability code overhead
        run: sh tests/lvgl/test_disabled.sh baseline
  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lvgl: [v8.0.2, v8.1.0, v8.2.0, v8.3.11, v8.4.0, v9.0.0, v9.1.0, v9.2.2, v9.3.0, v9.4.0, v9.5.0, v9.6.0]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact upstream test dependency (not production integration)
        run: git clone --depth 1 --branch '${{ matrix.lvgl }}' https://github.com/lvgl/lvgl.git /tmp/host-lvgl
      - name: Inventory public-looking declarations and unwrapped backlog
        run: python3 tools/lvgl_api_inventory.py /tmp/host-lvgl --json build/lvgl-api-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: lvgl-api-${{ matrix.lvgl }}
          path: build/lvgl-api-inventory.json
      - name: Configure, instrument both libraries, and test
        run: |
          cmake -S tests/lvgl -B build/lvgl -DLVGL_HOST_DIR=/tmp/host-lvgl -DSANITIZE=ON
          cmake --build build/lvgl --target test_lvgl -j2
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build/lvgl --verbose | tee build/lvgl/sanitizer.log
          python3 tests/lvgl/check_sanitizer_log.py --lvgl-version '${{ matrix.lvgl }}' build/lvgl/sanitizer.log
  minimal:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lvgl: [v8.4.0, v9.2.2, v9.6.0]
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch '${{ matrix.lvgl }}' https://github.com/lvgl/lvgl.git /tmp/host-lvgl
      - name: No HAL, no drivers, optional widgets disabled, explicit header override
        run: |
          extra=
          if [ '${{ matrix.lvgl }}' = v8.4.0 ]; then extra=-DLV_USE_USER_DATA=0; fi
          cmake -S tests/lvgl -B build/lvgl -DLVGL_HOST_DIR=/tmp/host-lvgl -DSANITIZE=ON -DMINIMAL_WIDGETS=ON -DNO_COMPRESSED_FONTS=ON -DMICROCS_LVGL_INCLUDE=lvgl.h "-DCMAKE_C_FLAGS=-DMCS_ENABLE_HAL=0 -DMCS_ENABLE_DRIVERS=0 $extra"
          cmake --build build/lvgl --target test_lvgl -j2
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build/lvgl --verbose | tee build/lvgl/sanitizer.log
          python3 tests/lvgl/check_sanitizer_log.py --lvgl-version '${{ matrix.lvgl }}' build/lvgl/sanitizer.log
  font-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch v9.3.0 https://github.com/lvgl/lvgl.git /tmp/host-lvgl
      - name: Reject unsupported compressed font before native rendering
        run: |
          cmake -S tests/lvgl -B build/lvgl -DLVGL_HOST_DIR=/tmp/host-lvgl -DSANITIZE=ON -DNO_COMPRESSED_FONTS=ON
          cmake --build build/lvgl --target test_lvgl -j2
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build/lvgl --verbose | tee build/lvgl/sanitizer.log
          python3 tests/lvgl/check_sanitizer_log.py --lvgl-version v9.3.0 build/lvgl/sanitizer.log
