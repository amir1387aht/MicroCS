name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host · ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: CI dependency installer regression checks
        run: python3 tests/test_ci_apt.py
      - name: make check (tests, GC stress, feature-flag and profile builds)
        run: |
          set +e
          make CC=${{ matrix.cc }} check 2>&1 | tee /tmp/host-check.log
          result=${PIPESTATUS[0]}
          if [ "$result" != 0 ]; then
            python3 -c 'from pathlib import Path; s=Path("/tmp/host-check.log").read_text()[-3000:]; print("::error title=Host check failure::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$result"
      - name: Preserve full host failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-check-${{ matrix.cc }}
          path: /tmp/host-check.log

  sanitizers:
    name: ASan + UBSan · fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test suite under sanitizers
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make asan-test
      - name: Fuzz (source + image, short run)
        run: |
          python3 tools/fuzz.py ./mcs 400 $GITHUB_RUN_NUMBER
          python3 tools/fuzz.py ./mcs 400 $GITHUB_RUN_NUMBER --image

  oled-budget:
    name: 32-bit OLED · hard 40 KiB pool
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 32-bit C runtime and real U8g2
        run: sh tools/ci_apt.sh gcc-multilib
      - run: make fetch-u8g2
      - name: 32-bit with 8-byte numeric alignment, repeated Project cycles within 40960 bytes
        run: >-
          make oled-smallheap-test CC="gcc -m32 -malign-double"
          CFLAGS="-O2 -g -DOLED_HEAP_KB=40 -DOLED_BUDGET=1"
          U8G2_DISPLAYS="ssd1306_i2c_128x32_univision"
          U8G2_FONTS="helvR08_tf streamline_all_t ncenB08_te"

      - name: Actual app, 2000 content edits and 7.5 KB live state in the same 64 KiB pool
        run: >-
          make oled-repeat-test CC="gcc -m32 -malign-double"
          CFLAGS="-O2 -g -DOLED_REPEAT_HEAP_KB=64 -DOLED_REPEAT_BUDGET=1"
          U8G2_DISPLAYS="ssd1306_i2c_128x32_univision"
          U8G2_FONTS="helvR08_tf streamline_all_t ncenB08_te"

      - name: 32-bit automatic multi-region backing cap and runtime lifecycle
        run: |
          gcc -m32 -malign-double -O1 -g -std=gnu99 -Wall -Wextra -Werror -Iinclude \
            src/*.c modules/*/*.c tests/c/test_pool_regions.c -lm -o build/test_pool_regions_32
          ./build/test_pool_regions_32
          gcc -m32 -malign-double -O1 -g -std=gnu99 -Wall -Wextra -Werror \
            -Iinclude -Iports/esp32 -Itests/c/heap_sdk src/*.c modules/*/*.c \
            ports/esp32/mcs_port_esp32_heap.c tests/c/test_esp_pool_growth.c \
            -lm -o build/test_esp_pool_growth_32
          ./build/test_esp_pool_growth_32

  threads:
    name: OS threads (POSIX + ThreadSanitizer, FreeRTOS simulator, CMake)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: C# threads, channels, thread jobs under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: make tsan-test
      - name: FreeRTOS backend on the FreeRTOS POSIX port (FreeRTOS-Kernel V11.1.0)
        run: make freertos-test
      - name: CMake MICROCS_OS=posix / freertos, and the hint when FreeRTOS is not found
        run: |
          cmake -S . -B build/cm-posix -DMICROCS_OS=posix && cmake --build build/cm-posix -j
          build/cm-posix/mcs --fs tests/threads tests/threads/t_threads.cs | cmp - tests/threads/t_threads.out
          cmake -S . -B build/cm-frt -DMICROCS_OS=freertos -DMICROCS_FREERTOS_PATH=build/third_party/FreeRTOS-Kernel-11.1.0 \
            -DMICROCS_FREERTOS_CONFIG_DIR=tests/c/freertos && cmake --build build/cm-frt -j
          if cmake -S . -B build/cm-none -DMICROCS_OS=freertos > build/cm-none.txt 2>&1; then echo "configure succeeded without FreeRTOS"; exit 1; fi
          grep -q "MICROCS_FREERTOS_PATH" build/cm-none.txt

  flash-fs:
    name: Flash filesystems (LittleFS, YAFFS2, TinyFS on simulated flash)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make lfs-test
      - run: make yaffs-test
      - name: TinyFS (internal flash, power cut at every step)
        run: make tinyfs-test

  studio:
    name: Studio (browser, fake Web Serial)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make -j
      - run: npm install --no-save --no-package-lock playwright-core@1
      - name: tools/studio against the host device shell
        run: |
          set +e
          CHROME=$(command -v google-chrome || command -v chromium) node tests/studio/test_studio.js ./mcs 2>&1 | tee /tmp/studio-test.log
          result=${PIPESTATUS[0]}
          if [ "$result" != 0 ]; then
            python3 -c 'from pathlib import Path; s=Path("/tmp/studio-test.log").read_text()[-2500:]; print("::error title=Studio failure::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$result"
      - name: Project save/build/run and automatic formatting
        run: |
          set +e
          CHROME=$(command -v google-chrome || command -v chromium) node tests/studio/test_project.js ./mcs 2>&1 | tee /tmp/studio-project-test.log
          result=${PIPESTATUS[0]}
          if [ "$result" != 0 ]; then
            python3 -c 'from pathlib import Path; s=Path("/tmp/studio-project-test.log").read_text()[-6000:]; print("::error title=Studio Project failure::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$result"
      - name: Automatic app replacement through the complete runtime
        run: |
          make build/test_app_replace
          CHROME=$(command -v google-chrome || command -v chromium) node tests/studio/test_app_replace_browser.js
      - name: Duplicate device opens and incremental File-mode saves
        run: CHROME=$(command -v google-chrome || command -v chromium) node tests/studio/test_open_upload.js
      - name: Device-side file changes in open tabs
        run: CHROME=$(command -v google-chrome || command -v chromium) node tests/studio/test_file_refresh.js
      - name: Workbench commands, accessibility and scoped language service
        run: |
          node tests/studio/test_language.js
          CHROME=$(command -v google-chrome || command -v chromium) node tests/studio/test_workbench.js
      - name: Terminal visibility and shortcuts
        run: CHROME=$(command -v google-chrome || command -v chromium) node tests/studio/test_terminal.js
      - name: Supported-only template filter and saved preference
        run: CHROME=$(command -v google-chrome || command -v chromium) node tests/studio/test_supported_filter.js
      - name: Template gallery geometry (desktop, phone, compact window)
        run: CHROME=$(command -v google-chrome || command -v chromium) node tests/studio/test_gallery_layout.js
      - name: Explorer tree and legacy firmware compatibility
        run: |
          CHROME=$(command -v google-chrome || command -v chromium) node tests/studio/test_explorer_compat.js
          CHROME=$(command -v google-chrome || command -v chromium) node tests/studio/test_legacy.js ./mcs
      - name: ESP BLE menuconfig gating and limits
        run: |
          python3 -m pip install kconfiglib==14.1.0
          python3 tests/test_esp_config.py
      - name: Capability-aware template metadata and filtering
        run: node tests/studio/test_capabilities.js && node tests/studio/test_app_replace.js && node tests/studio/test_upload_stop.js && node tests/studio/test_console_queue.js && node tests/studio/test_editor_focus.js && python3 tests/test_template_metadata.py
      - name: Script input echo ownership (machine protocol and raw REPL)
        run: python3 tests/test_readline_echo.py ./mcs
      - name: C# interpolated / verbatim string highlighting
        run: node tests/studio/test_highlight.js
      - name: templates.js is generated from tools/studio/templates/
        run: python3 tools/studio/gen_templates.py --check
      - name: every Studio template compiles and runs on the simulated board
        run: node tests/studio/test_templates.js ./mcs
      - name: Bluetooth LE templates on the simulated radio (make mcs-ble)
        run: make mcs-ble && node tests/studio/test_templates.js build/mcs_ble --only=ble

  cortex-m:
    name: Cortex-M0/M4/M33 (emulated)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolchain + emulator
        timeout-minutes: 20
        run: |
          sh tools/ci_apt.sh gcc-arm-none-eabi libnewlib-arm-none-eabi
          pip install unicorn
      - name: Cortex-M build and emulator checks
        run: |
          set +e
          make cm-check 2>&1 | tee /tmp/cm-check.log
          result=${PIPESTATUS[0]}
          if [ "$result" != 0 ]; then
            python3 -c 'from pathlib import Path; s=Path("/tmp/cm-check.log").read_text()[-2800:]; print("::error title=Cortex-M failure::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$result"
      - run: make mcu-bench

  dotnet-parity:
    name: .NET 8 parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Output byte-identical to .NET
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1
        run: sh tools/verify_dotnet.sh

  cmake:
    name: CMake build (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/cmake && cmake --build build/cmake -j && echo 'Console.WriteLine(6 * 7);' > /tmp/a.cs && build/cmake/mcs /tmp/a.cs
      - name: MICROCS_BLE=ON (simulated radio, mcs --sim)
        run: |
          cmake -S . -B build/cmake-ble -DMICROCS_BLE=ON && cmake --build build/cmake-ble -j
          echo 'Console.WriteLine(Ble.Backend);' > /tmp/b.cs && build/cmake-ble/mcs --sim /tmp/b.cs | grep -qx sim
      - name: Project config header (mcs_user_config.h found next to CMakeLists.txt, MICROCS_PROFILE, -D)
        run: cmake -S tests/c/config -B build/cfg && cmake --build build/cfg -j && build/cfg/test_config


  u8g2:
    name: U8g2 displays (optional, u8g2 2.37.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Without the sources, configure and compile stop with instructions
        run: |
          if cmake -S . -B /tmp/nou8 -DMICROCS_U8G2=ON > /tmp/nou8.txt 2>&1; then echo "configure succeeded without u8g2"; exit 1; fi
          grep -q "MICROCS_U8G2_DIR" /tmp/nou8.txt && grep -q "MICROCS_U8G2_DOWNLOAD" /tmp/nou8.txt && echo "OK configure hint"
          if cmake -S . -B /tmp/badu8 -DMICROCS_U8G2=ON -DMICROCS_U8G2_DOWNLOAD=ON -DMICROCS_U8G2_DISPLAYS=no_such_display > /tmp/badu8.txt 2>&1; then echo "bad display name accepted"; exit 1; fi
          grep -q "no display 'no_such_display'" /tmp/badu8.txt && echo "OK name check"
      - name: CMake host build (download, display and font lists, Arduino names)
        run: |
          cmake -S . -B build/cu8 -DMICROCS_U8G2=ON -DMICROCS_U8G2_DOWNLOAD=ON \
            "-DMICROCS_U8G2_DISPLAYS=ssd1306_i2c_128x64_noname;U8G2_SH1106_128X64_NONAME_F_HW_I2C;st7920_s_128x64" \
            "-DMICROCS_U8G2_FONTS=profont12_tr;6x10_tf"
          cmake --build build/cu8 -j
          build/cu8/mcs --features | grep -q u8g2
          build/cu8/mcs --oled -e 'var d = new U8g2("sh1106_128x64_noname"); d.Begin(); d.DrawStr(0, 12, "CMake"); d.SendBuffer(); Console.WriteLine(d.Font + " " + string.Join(",", U8g2.Displays));' 2>/dev/null | tee /tmp/cu8.txt
          grep -q "profont12_tr ssd1306_i2c_128x64_noname,sh1106_i2c_128x64_noname,st7920_s_128x64" /tmp/cu8.txt
      - name: make u8g2-test (scripts vs. simulated SSD1306 / SH1106 frames, font files, examples)
        run: make fetch-u8g2 u8g2-test
      - name: Studio U8g2 / U8x8 templates on the simulated OLED
        run: node tests/studio/test_templates.js build/mcs_u8g2 --only=u8g2
      - name: 100 KB OLED/menu runtime, partial startup recovery and ordered project cycles
        run: make oled-smallheap-test U8G2_DISPLAYS="ssd1312_i2c_120x28 ssd1306_i2c_128x32_univision" U8G2_FONTS="helvR08_tf streamline_all_t ncenB08_te"
      - name: tools/u8g2.py (lists, config lines)
        run: |
          python3 tools/u8g2.py displays ssd1306 | head -5
          python3 tools/u8g2.py fonts logisoso | head -5
          python3 tools/u8g2.py config --displays ssd1306_i2c_128x64_noname --fonts helvB10_tr

  pico:
    name: Raspberry Pi Pico · ${{ matrix.board }} ${{ matrix.fs }}${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico2]
        fs: [littlefs]
        include:
          - { board: pico2, fs: yaffs2 }
          - { board: pico, fs: tinyfs, args: "-DMICROCS_FS_SIZE=65536" }
          - { board: waveshare_rp2040_zero, fs: littlefs }
          - { board: adafruit_qtpy_rp2040, fs: littlefs, args: "-DMICROCS_WS2812=OFF", name: " no ws2812", tag: "-no-ws2812" }
          - { board: waveshare_rp2040_zero, fs: littlefs, args: "-DMICROCS_OS=freertos -DFREERTOS_KERNEL_PATH=$HOME/FreeRTOS-Kernel", name: " FreeRTOS SMP (both cores)", tag: "-freertos", freertos: true }
          - { board: pico2, fs: tinyfs, args: "-DMICROCS_OS=freertos -DFREERTOS_KERNEL_PATH=$HOME/FreeRTOS-Kernel", name: " FreeRTOS SMP (both cores)", tag: "-freertos", freertos: true }
          - { board: pico, fs: tinyfs, args: "-DMICROCS_U8G2=ON -DMICROCS_U8G2_DOWNLOAD=ON", name: " u8g2", tag: "-u8g2" }
          - { board: pico_w, fs: littlefs, args: "-DMICROCS_OS=freertos -DFREERTOS_KERNEL_PATH=$HOME/FreeRTOS-Kernel", name: " Wi-Fi (FreeRTOS + lwIP)", tag: "-wifi", freertos: true, wifi: true }
          - { board: pico2_w, fs: littlefs, args: "-DMICROCS_OS=freertos -DFREERTOS_KERNEL_PATH=$HOME/FreeRTOS-Kernel", name: " Wi-Fi (FreeRTOS + lwIP)", tag: "-wifi", freertos: true, wifi: true }
          - { board: pico_w, fs: littlefs, args: "-DMICROCS_BLE=ON -DMICROCS_WIFI=OFF", name: " BLE (BTstack, no OS)", tag: "-ble", ble: true }
          - { board: pico2_w, fs: littlefs, args: "-DMICROCS_BLE=ON -DMICROCS_OS=freertos -DFREERTOS_KERNEL_PATH=$HOME/FreeRTOS-Kernel", name: " Wi-Fi + BLE (FreeRTOS)", tag: "-wifi-ble", freertos: true, wifi: true, ble: true }
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain + pico-sdk
        timeout-minutes: 20
        run: |
          sh tools/ci_apt.sh gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake ninja-build
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
          git -C $HOME/pico-sdk submodule update --init --depth 1 lib/tinyusb
          if [ "${{ matrix.wifi }}" = true ] || [ "${{ matrix.ble }}" = true ]; then git -C $HOME/pico-sdk submodule update --init --depth 1 lib/cyw43-driver lib/lwip; fi
          if [ "${{ matrix.ble }}" = true ]; then git -C $HOME/pico-sdk submodule update --init --depth 1 lib/btstack; fi
      - name: FreeRTOS-Kernel (Raspberry Pi's fork, as in the release images; RP2040 + RP2350 SMP ports)
        if: ${{ matrix.freertos }}
        run: mkdir -p $HOME/FreeRTOS-Kernel && curl -sSL https://github.com/raspberrypi/FreeRTOS-Kernel/archive/4f7299d6ea746b27a9dd19e87af568e34bd65b15.tar.gz | tar xz --strip-components=1 -C $HOME/FreeRTOS-Kernel
      - name: Filesystem sources (LittleFS from a local clone; YAFFS2 through the opt-in download)
        run: |
          if [ "${{ matrix.fs }}" = littlefs ]; then
            git clone -q --depth 1 --branch v2.9.3 https://github.com/littlefs-project/littlefs.git $HOME/littlefs
            echo "FS_ARGS=-DMICROCS_LITTLEFS_DIR=$HOME/littlefs" >> $GITHUB_ENV
          elif [ "${{ matrix.fs }}" = tinyfs ]; then
            echo "TinyFS is built in: nothing to fetch"
          else
            echo "FS_ARGS=-DMICROCS_FS_DOWNLOAD=ON" >> $GITHUB_ENV
          fi
      - name: Build ports/rp2/example
        run: |
          cmake -S ports/rp2/example -B build/${{ matrix.board }} -G Ninja -DPICO_BOARD=${{ matrix.board }} -DPICO_SDK_PATH=$HOME/pico-sdk -DMICROCS_FS=${{ matrix.fs }} $FS_ARGS ${{ matrix.args }}
          cmake --build build/${{ matrix.board }}
          arm-none-eabi-size build/${{ matrix.board }}/microcs_pico.elf
          if [ "${{ matrix.wifi }}" = true ]; then
            arm-none-eabi-nm build/${{ matrix.board }}/microcs_pico.elf | grep -q ' mcs_rp2_net$' || { echo "::error::Wi-Fi backend missing"; exit 1; }
          fi
          if [ "${{ matrix.ble }}" = true ]; then
            arm-none-eabi-nm build/${{ matrix.board }}/microcs_pico.elf | grep -q ' mcs_rp2_ble$' || { echo "::error::BLE backend missing"; exit 1; }
          fi
      - name: Keep the firmware (download it from the run's Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: "firmware-${{ matrix.board }}-${{ matrix.fs }}${{ matrix.tag }}"
          path: build/${{ matrix.board }}/microcs_pico.uf2
          retention-days: 14
      - name: Without sources or MICROCS_FS_DOWNLOAD the configure stops with a hint
        if: ${{ matrix.board == 'pico' && matrix.fs == 'littlefs' && !matrix.args }}
        run: |
          if cmake -S ports/rp2/example -B build/nofs -G Ninja -DPICO_BOARD=pico -DPICO_SDK_PATH=$HOME/pico-sdk > build/nofs.txt 2>&1; then
            echo "configure succeeded without LittleFS sources"; exit 1
          fi
          grep -q "MICROCS_LITTLEFS_DIR" build/nofs.txt && grep -q "MICROCS_FS_DOWNLOAD" build/nofs.txt

  esp-idf:
    name: ESP-IDF · ${{ matrix.target }} ${{ matrix.fs }}
    runs-on: ubuntu-24.04
    container: espressif/idf:${{ matrix.idf || 'v5.3.2' }}
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3, esp32c2, esp32c3, esp32c6]
        fs: [littlefs]
        include:
          - { target: esp32s3, fs: yaffs2 }
          - { target: esp32c3, fs: tinyfs }
          - { target: esp32, fs: threads }
          - { target: esp32s3, fs: threads }
          - { target: esp32c3, fs: threads }
          - { target: esp32s3, fs: u8g2 }
          - { target: esp32, fs: ble }
          - { target: esp32s3, fs: ble }
          - { target: esp32c3, fs: ble }
          - { target: esp32c2, fs: ble }
          - { target: esp32c6, fs: ble }
          - { target: esp32h2, fs: ble }
          - { target: esp32c5, fs: ble, idf: v5.5.2 }
          - { target: esp32c61, fs: ble, idf: v5.5.2 }
          - { target: esp32s2, fs: littlefs }
          - { target: esp32p4, fs: littlefs }
    steps:
      - uses: actions/checkout@v4
      - name: Build ports/esp32/example
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          # build it the way users do: the example as a project, MicroCS in components/MicroCS
          mkdir -p /tmp/proj/components
          cp -r ports/esp32/example/. /tmp/proj/
          cp -r . /tmp/proj/components/MicroCS
          cd /tmp/proj
          # YAFFS2 sources are not bundled: allow the pinned download (or set MICROCS_YAFFS2_DIR)
          if [ "${{ matrix.fs }}" = yaffs2 ]; then echo CONFIG_MICROCS_FS_YAFFS2=y >> sdkconfig.defaults; export MICROCS_FS_DOWNLOAD=1; fi
          if [ "${{ matrix.fs }}" = tinyfs ]; then echo CONFIG_MICROCS_FS_TINYFS=y >> sdkconfig.defaults; fi
          # "threads": LittleFS + real C# threads on FreeRTOS tasks (both cores on ESP32 / S3)
          if [ "${{ matrix.fs }}" = threads ]; then echo CONFIG_MICROCS_THREADS=y >> sdkconfig.defaults; fi
          # "u8g2": LittleFS + C# U8g2 / U8x8, u8g2 2.37.1 downloaded at configure time
          if [ "${{ matrix.fs }}" = u8g2 ]; then printf 'CONFIG_MICROCS_U8G2=y\nCONFIG_MICROCS_U8G2_DOWNLOAD=y\n' >> sdkconfig.defaults; fi
          # "ble": LittleFS + Wi-Fi + C# Ble on NimBLE (ports/esp32/example/sdkconfig.ble)
          if [ "${{ matrix.fs }}" = ble ]; then
            cat sdkconfig.ble >> sdkconfig.defaults
            echo CONFIG_MICROCS_THREADS=y >> sdkconfig.defaults
          fi
          # The non-BLE release targets still ship real threads.
          case "${{ matrix.target }}" in esp32s2|esp32p4) echo CONFIG_MICROCS_THREADS=y >> sdkconfig.defaults ;; esac
          idf.py set-target ${{ matrix.target }}
          # C6 needs its target defaults to keep Wi-Fi + BLE + CAN in the 2 MB app slot.
          if [ "${{ matrix.target }}" = esp32c6 ]; then grep -qx 'CONFIG_COMPILER_SAVE_RESTORE_LIBCALLS=y' sdkconfig; fi
          idf.py build
          # Kconfig must not silently drop BLE, including on low-RAM C2 and BLE-only H2.
          if [ "${{ matrix.fs }}" = ble ]; then
            grep -qx 'CONFIG_MICROCS_BLE=y' sdkconfig
            grep -qx 'CONFIG_BT_NIMBLE_ENABLED=y' sdkconfig
            grep -qx 'CONFIG_BT_CONTROLLER_ENABLED=y' sdkconfig
            # IDF tool prefixes differ by architecture; use the configured nm from CMake.
            NM=$(sed -n 's/^CMAKE_NM:FILEPATH=//p' build/CMakeCache.txt)
            "$NM" build/*.elf > /tmp/mcs-symbols.txt
            grep -q ' mcs_esp32_ble$' /tmp/mcs-symbols.txt
          else
            ! grep -qx 'CONFIG_MICROCS_BLE=y' sdkconfig
          fi
          # one image for `esptool.py write_flash 0 ...` (bootloader + partition table + app)
          mkdir -p $GITHUB_WORKSPACE/fw
          cd build && esptool.py --chip ${{ matrix.target }} merge_bin -o $GITHUB_WORKSPACE/fw/microcs-${{ matrix.target }}-${{ matrix.fs }}.bin @flash_args
      - name: Keep the firmware (download it from the run's Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: "firmware-${{ matrix.target }}-${{ matrix.fs }}"
          path: fw/*.bin
          retention-days: 14

  zephyr:
    name: Zephyr · ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: native_sim (run), board: native_sim/native/64 }
          - { name: native_sim YAFFS2 (run), board: native_sim/native/64, fs: yaffs2, args: "-DEXTRA_CONF_FILE=overlay-yaffs2.conf -DEXTRA_DTC_OVERLAY_FILE=boards/native_sim_yaffs2.overlay -DMICROCS_FS_DOWNLOAD=ON" }
          - { name: native_sim TinyFS (run), board: native_sim/native/64, fs: tinyfs, args: "-DEXTRA_CONF_FILE=overlay-tinyfs.conf" }
          - { name: nRF52840 DK, board: nrf52840dk/nrf52840 }
          - { name: nRF52840 DK poweroff, board: nrf52840dk/nrf52840, args: "-DEXTRA_CONF_FILE=overlay-poweroff.conf" }
          - { name: nRF52840 DK USB console, board: nrf52840dk/nrf52840, args: "-DEXTRA_CONF_FILE=overlay-usb.conf -DEXTRA_DTC_OVERLAY_FILE=usb.overlay" }
          - { name: native_sim threads (run), board: native_sim/native/64, threads: threads, args: "-DEXTRA_CONF_FILE=overlay-threads.conf" }
          - { name: nRF52840 DK threads, board: nrf52840dk/nrf52840, args: "-DEXTRA_CONF_FILE=overlay-threads.conf" }
          - { name: Raspberry Pi Pico, board: rpi_pico }
          - { name: STM32 Nucleo-F429ZI, board: nucleo_f429zi }
          - { name: nRF52840 DK BLE, board: nrf52840dk/nrf52840, args: "-DEXTRA_CONF_FILE=overlay-ble.conf" }
          - { name: nRF52840 DK u8g2, board: nrf52840dk/nrf52840, args: "-DCONFIG_MICROCS_U8G2=y -DCONFIG_MICROCS_U8G2_DOWNLOAD=y" }
    steps:
      - uses: actions/checkout@v4
        with:
          path: microcs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: West workspace (Zephyr v4.1.0 + the HALs in ports/zephyr/west.yml)
        run: |
          pip install -q west ninja cmake
          west init -l microcs --mf ports/zephyr/west.yml
          west update --narrow -o=--depth=1
          pip install -q -r zephyr/scripts/requirements-base.txt
      - name: Zephyr SDK (ARM toolchain)
        if: ${{ !startsWith(matrix.board, 'native') }}
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.0/zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz -C $HOME
          $HOME/zephyr-sdk-0.17.0/setup.sh -t arm-zephyr-eabi -c
      - name: west build ports/zephyr/example
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: ${{ startsWith(matrix.board, 'native') && 'host' || 'zephyr' }}
        run: west build -b ${{ matrix.board }} -d build microcs/ports/zephyr/example -- ${{ matrix.args }}
      - name: Smoke test on native_sim (REPL, Studio protocol, LittleFS, jobs)
        if: ${{ startsWith(matrix.board, 'native') }}
        run: python3 microcs/tests/zephyr/smoke.py build/zephyr/zephyr.exe ${{ matrix.fs || 'littlefs' }} ${{ matrix.threads }}

  arduino:
    name: Arduino · ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ESP32, core: "esp32:esp32", fqbn: "esp32:esp32:esp32", url: "https://espressif.github.io/arduino-esp32/package_esp32_index.json" }
          - { name: ESP32-S3, core: "esp32:esp32", fqbn: "esp32:esp32:esp32s3", url: "https://espressif.github.io/arduino-esp32/package_esp32_index.json" }
          - { name: ESP32-C3, core: "esp32:esp32", fqbn: "esp32:esp32:esp32c3", url: "https://espressif.github.io/arduino-esp32/package_esp32_index.json" }
          - { name: Raspberry Pi Pico, core: "rp2040:rp2040", fqbn: "rp2040:rp2040:rpipico", url: "https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json" }
          - { name: Raspberry Pi Pico 2, core: "rp2040:rp2040", fqbn: "rp2040:rp2040:rpipico2", url: "https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json" }
          - { name: Nano 33 BLE (nRF52840 Mbed), core: "arduino:mbed_nano", fqbn: "arduino:mbed_nano:nano33ble", url: "" }
          - { name: "Raspberry Pi Pico (YAFFS2 bundled, no ws2812)", core: "rp2040:rp2040", fqbn: "rp2040:rp2040:rpipico", url: "https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json", pack: "--fs yaffs2 --no-ws2812" }
          - { name: "Nano 33 BLE (BLE, ArduinoBLE)", core: "arduino:mbed_nano", fqbn: "arduino:mbed_nano:nano33ble", url: "", pack: "--ble" }
          - { name: "ESP32 (u8g2)", core: "esp32:esp32", fqbn: "esp32:esp32:esp32", url: "https://espressif.github.io/arduino-esp32/package_esp32_index.json", pack: "--u8g2 --u8g2-displays ssd1306_i2c_128x64_noname,sh1106_i2c_128x64_noname --u8g2-fonts helvB10_tr,6x10_tf" }
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Core + SD library
        run: |
          URLS="${{ matrix.url }}"
          arduino-cli core update-index ${URLS:+--additional-urls $URLS}
          arduino-cli core install ${{ matrix.core }} ${URLS:+--additional-urls $URLS}
          arduino-cli lib install SD
          case "${{ matrix.pack }}" in *--u8g2*) arduino-cli lib install U8g2;; esac
          case "${{ matrix.pack }}" in *--ble*) arduino-cli lib install ArduinoBLE;; esac
      - name: Package the library (tools/make_arduino.py) and compile every example
        run: |
          case "${{ matrix.pack }}" in *yaffs2*) make -s fetch-yaffs;; esac
          python3 tools/make_arduino.py --out dist/arduino ${{ matrix.pack }}
          for ex in dist/arduino/MicroCS/examples/*/; do
            echo "::group::$ex"
            arduino-cli compile --fqbn ${{ matrix.fqbn }} --library dist/arduino/MicroCS --warnings default "$ex"
            echo "::endgroup::"
          done

  stm32:
    name: STM32 · ${{ matrix.board }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: "Blue Pill (F103C8)", family: f1, device: STM32F103xB, cpu: cortex-m3 }
          - { board: "Nucleo-F072RB", family: f0, device: STM32F072xB, cpu: cortex-m0 }
          - { board: "Black Pill (F401CC)", family: f4, device: STM32F401xC, cpu: cortex-m4 }
          - { board: "Black Pill (F411CE)", family: f4, device: STM32F411xE, cpu: cortex-m4 }
          - { board: "STM32F4-Discovery (F407VG)", family: f4, device: STM32F407xx, cpu: cortex-m4 }
          - { board: "STM32F429I-Discovery (F429ZI)", family: f4, device: STM32F429xx, cpu: cortex-m4 }
          - { board: "Nucleo-F446RE", family: f4, device: STM32F446xx, cpu: cortex-m4 }
          - { board: "Nucleo-F767ZI", family: f7, device: STM32F767xx, cpu: cortex-m7 }
          - { board: "Nucleo-G071RB", family: g0, device: STM32G071xx, cpu: cortex-m0plus }
          - { board: "Nucleo-G431KB", family: g4, device: STM32G431xx, cpu: cortex-m4 }
          - { board: "Nucleo-G474RE", family: g4, device: STM32G474xx, cpu: cortex-m4 }
          - { board: "Nucleo-H563ZI", family: h5, device: STM32H563xx, cpu: cortex-m33 }
          - { board: "Nucleo-H743ZI", family: h7, device: STM32H743xx, cpu: cortex-m7 }
          - { board: "Nucleo-L073RZ", family: l0, device: STM32L073xx, cpu: cortex-m0plus }
          - { board: "Nucleo-L432KC", family: l4, device: STM32L432xx, cpu: cortex-m4 }
          - { board: "Nucleo-L476RG", family: l4, device: STM32L476xx, cpu: cortex-m4 }
          - { board: "Nucleo-U575ZI", family: u5, device: STM32U575xx, cpu: cortex-m33 }
          - { board: "Nucleo-WB55RG", family: wb, device: STM32WB55xx, cpu: cortex-m4 }
    steps:
      - uses: actions/checkout@v4
      # ST headers (shallow clones), LittleFS and YAFFS2 sources: cached per family
      - uses: actions/cache@v4
        with:
          path: |
            build/sdk
            build/third_party
          key: stm32-sdk-${{ matrix.family }}-${{ hashFiles('Makefile') }}
          restore-keys: stm32-sdk-${{ matrix.family }}-
      - name: Arm GCC
        timeout-minutes: 20
        run: |
          sh tools/ci_apt.sh gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Compile the port (default, no ws2812/servo, no drivers, auto profile, internal flash + LittleFS / YAFFS2 / TinyFS) in parallel
        run: sh tools/check_ports.sh stm32 ${{ matrix.family }} ${{ matrix.device }} ${{ matrix.cpu }}

  # The ready-to-flash STM32 firmware published with every release: link it for each
  # board and boot it in the Renode emulator where Renode models the chip (STM32F4, H743):
  # REPL prompt, an expression, a file written to the internal flash (TinyFS), the LED.
  stm32-firmware:
    name: STM32 firmware · ${{ matrix.board }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: nucleo_f401re, family: f4, renode: "platforms/cpus/stm32f4.repl sysbus.usart2" }
          - { board: nucleo_f411re, family: f4, renode: "platforms/cpus/stm32f4.repl sysbus.usart2" }
          - { board: nucleo_f446re, family: f4, renode: "platforms/cpus/stm32f4.repl sysbus.usart2" }
          - { board: blackpill_f411ce, family: f4, renode: "platforms/cpus/stm32f4.repl sysbus.usart1" }
          - { board: nucleo_g474re, family: g4 }
          - { board: nucleo_l476rg, family: l4 }
          - { board: nucleo_h743zi, family: h7, renode: "platforms/cpus/stm32h743.repl sysbus.usart3" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/sdk
          key: stm32-fw-sdk-${{ matrix.family }}-${{ hashFiles('tools/build_stm32_firmware.sh') }}
          restore-keys: stm32-fw-sdk-${{ matrix.family }}-
      - uses: actions/cache@v4
        if: matrix.renode
        with:
          path: ~/renode
          key: renode-1.16.1
      - name: Arm GCC
        timeout-minutes: 20
        run: |
          sh tools/ci_apt.sh gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build the firmware (.elf / .bin / .hex)
        run: sh tools/build_stm32_firmware.sh ${{ matrix.board }}
      - name: Boot it in Renode and use the REPL
        if: matrix.renode
        run: |
          if [ ! -x ~/renode/renode ]; then
            mkdir -p ~/renode
            curl -sSfL https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable-dotnet.tar.gz | tar xz -C ~/renode --strip-components=1
          fi
          python3 tools/renode_check.py ~/renode/renode build/fw/stm32/microcs-${{ matrix.board }}.elf ${{ matrix.renode }}
      - uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware-${{ matrix.board }}
          path: build/fw/stm32/microcs-${{ matrix.board }}.*
