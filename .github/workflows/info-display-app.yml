name: Info display app memory
on:
  pull_request:
  push:
    branches: [main, perf/profile-oled-app]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-32bit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit compiler support
        run: sh tools/ci_apt.sh gcc-multilib
      - name: Fetch pinned U8g2
        run: make fetch-u8g2
      - name: Build profiler and run historical memory regression matrix
        run: make oled-settings-memory-test CC="gcc -m32 -malign-double" U8G2_DISPLAYS=ssd1306_i2c_96x16_er U8G2_FONTS=ncenB08_te
      - name: Check corrected app persistence and 55 KB bytecode budget
        run: python3 tests/test_info_display_commit.py build/profile_oled32
