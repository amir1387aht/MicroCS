name: Release

# Publishes GitHub release v<MCS_VERSION_STRING> with ready-to-flash firmware when include/mcs.h
# gets a version that has no release yet. Actions -> Release -> Run workflow rebuilds the current
# version and replaces/adds its files on the existing release.
#   Raspberry Pi Pico / Pico 2 / RP2040-Zero: hold BOOTSEL, plug in, copy the .uf2 to the drive
#   ESP32 boards: esptool.py --chip <chip> write_flash 0 microcs-<chip>.bin
#   STM32 Nucleo: copy microcs-<board>.bin to the ST-LINK drive; Black Pill: dfu-util (USB DFU)
#   Linux: the mcs compiler, REPL and simulator;  Arduino IDE: the library zip
on:
  push:
    branches: [main]
    paths: [include/mcs.h, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version check
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(sed -n 's/^#define MCS_VERSION_STRING "\(.*\)"/\1/p' include/mcs.h)
          echo "version=$v" >> $GITHUB_OUTPUT
          # a manual run rebuilds and refreshes the files of an existing release (e.g. after adding a board)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo "new=true" >> $GITHUB_OUTPUT; echo "manual run: (re)building v$v"
          elif gh release view "v$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "new=false" >> $GITHUB_OUTPUT; echo "v$v already released"
          else echo "new=true" >> $GITHUB_OUTPUT; echo "releasing v$v"; fi

  host:
    name: mcs · ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          make -s mcs CFLAGS="-O2"
          make -s test
          strip mcs
          mkdir -p out && tar czf out/mcs-${{ needs.version.outputs.version }}-${{ matrix.name }}.tar.gz mcs README.md LICENSE
      - uses: actions/upload-artifact@v4
        with: { name: "host-${{ matrix.name }}", path: out/* }

  pico:
    name: firmware · ${{ matrix.board }}
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { board: pico, wifi: "OFF" }
          - { board: pico2, wifi: "OFF" }
          - { board: pico_w, wifi: "ON" }
          - { board: pico2_w, wifi: "ON" }
          - { board: waveshare_rp2040_zero, wifi: "OFF" }
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain, pico-sdk, LittleFS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake ninja-build
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
          git -C $HOME/pico-sdk submodule update --init --depth 1 lib/tinyusb lib/cyw43-driver lib/lwip
          git clone -q --depth 1 --branch v2.9.3 https://github.com/littlefs-project/littlefs.git $HOME/littlefs
          # FreeRTOS SMP from Raspberry Pi's FreeRTOS-Kernel (the RTOS of pico-examples; RP2040 + RP2350 ports)
          mkdir -p $HOME/FreeRTOS-Kernel && curl -sSL https://github.com/raspberrypi/FreeRTOS-Kernel/archive/4f7299d6ea746b27a9dd19e87af568e34bd65b15.tar.gz | tar xz --strip-components=1 -C $HOME/FreeRTOS-Kernel
      - name: Build ports/rp2/example (FreeRTOS SMP, C# threads on both cores)
        run: |
          cmake -S ports/rp2/example -B build/fw -G Ninja -DPICO_BOARD=${{ matrix.board }} -DPICO_SDK_PATH=$HOME/pico-sdk -DMICROCS_FS=littlefs -DMICROCS_LITTLEFS_DIR=$HOME/littlefs \
            -DMICROCS_OS=freertos -DFREERTOS_KERNEL_PATH=$HOME/FreeRTOS-Kernel -DMICROCS_WIFI=${{ matrix.wifi }}
          cmake --build build/fw
          arm-none-eabi-nm build/fw/microcs_pico.elf > /tmp/mcs-symbols.txt
          grep -q ' mcs_capability_names$' /tmp/mcs-symbols.txt
          if [ "${{ matrix.wifi }}" = ON ]; then
            grep -q ' mcs_rp2_net$' /tmp/mcs-symbols.txt
          fi
          mkdir -p out && cp build/fw/microcs_pico.uf2 out/microcs-${{ needs.version.outputs.version }}-${{ matrix.board }}.uf2
      - uses: actions/upload-artifact@v4
        with: { name: "fw-${{ matrix.board }}", path: out/* }

  esp32:
    name: firmware · ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-24.04
    container: espressif/idf:${{ matrix.idf }}
    strategy:
      matrix:
        include:
          - { target: esp32, idf: v5.3.2, wifi: true, ble: true }
          - { target: esp32s2, idf: v5.3.2, wifi: true, ble: false }
          - { target: esp32s3, idf: v5.3.2, wifi: true, ble: true }
          - { target: esp32c2, idf: v5.3.2, wifi: true, ble: true }
          - { target: esp32c3, idf: v5.3.2, wifi: true, ble: true }
          - { target: esp32c6, idf: v5.3.2, wifi: true, ble: true }
          - { target: esp32h2, idf: v5.3.2, wifi: false, ble: true }
          - { target: esp32p4, idf: v5.3.2, wifi: false, ble: false }
          - { target: esp32c5, idf: v5.5.2, wifi: true, ble: true }
          - { target: esp32c61, idf: v5.5.2, wifi: true, ble: true }
    steps:
      - uses: actions/checkout@v4
      - name: Build ports/esp32/example (one image, flash at 0x0; C# threads; onboard Wi-Fi + ESP-NOW + BLE)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          mkdir -p /tmp/proj/components
          cp -r ports/esp32/example/. /tmp/proj/
          cp -r . /tmp/proj/components/MicroCS
          OUT=$PWD/out; mkdir -p $OUT
          cd /tmp/proj
          # FreeRTOS is ESP-IDF's own OS: release images run C# threads on its tasks (both cores on ESP32 / S3)
          echo CONFIG_MICROCS_THREADS=y >> sdkconfig.defaults
          # Wi-Fi defaults on when SOC_WIFI_SUPPORTED (also exposes ESP-NOW).
          # Only enable NimBLE on chips with an onboard BLE controller.
          if [ "${{ matrix.ble }}" = true ]; then cat sdkconfig.ble >> sdkconfig.defaults; fi
          idf.py set-target ${{ matrix.target }}
          idf.py build
          # Fail rather than publish an image whose requested radios were silently disabled.
          NM=$(sed -n 's/^CMAKE_NM:FILEPATH=//p' build/CMakeCache.txt)
          "$NM" build/*.elf > /tmp/mcs-symbols.txt
          grep -q ' mcs_capability_names$' /tmp/mcs-symbols.txt
          grep -qx 'CONFIG_MICROCS_THREADS=y' sdkconfig
          if [ "${{ matrix.wifi }}" = true ]; then
            grep -qx 'CONFIG_MICROCS_WIFI=y' sdkconfig
            grep -q ' mcs_esp32_net$' /tmp/mcs-symbols.txt
          else
            ! grep -qx 'CONFIG_MICROCS_WIFI=y' sdkconfig
          fi
          if [ "${{ matrix.ble }}" = true ]; then
            grep -qx 'CONFIG_MICROCS_BLE=y' sdkconfig
            grep -qx 'CONFIG_BT_NIMBLE_ENABLED=y' sdkconfig
            grep -qx 'CONFIG_BT_CONTROLLER_ENABLED=y' sdkconfig
            grep -q ' mcs_esp32_ble$' /tmp/mcs-symbols.txt
          else
            ! grep -qx 'CONFIG_MICROCS_BLE=y' sdkconfig
          fi
          cd build && esptool.py --chip ${{ matrix.target }} merge_bin -o $OUT/microcs-${{ needs.version.outputs.version }}-${{ matrix.target }}.bin @flash_args
      - uses: actions/upload-artifact@v4
        with: { name: "fw-${{ matrix.target }}", path: out/* }

  stm32:
    name: firmware · ${{ matrix.board }}
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [nucleo_f401re, nucleo_f411re, nucleo_f446re, blackpill_f411ce, nucleo_g474re, nucleo_l476rg, nucleo_h743zi]
    steps:
      - uses: actions/checkout@v4
      - name: Arm GCC
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build tools/build_stm32_firmware.sh (.bin + .hex)
        run: |
          sh tools/build_stm32_firmware.sh ${{ matrix.board }} build/fw
          mkdir -p out
          for e in bin hex; do cp build/fw/microcs-${{ matrix.board }}.$e out/microcs-${{ needs.version.outputs.version }}-${{ matrix.board }}.$e; done
      - uses: actions/upload-artifact@v4
        with: { name: "fw-${{ matrix.board }}", path: out/* }

  arduino:
    name: Arduino library
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/make_arduino.py --out dist/arduino
          mkdir -p out && cp dist/arduino/MicroCS-*.zip out/
      - uses: actions/upload-artifact@v4
        with: { name: arduino, path: out/* }

  publish:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, host, pico, esp32, stm32, arduino]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: release-files, merge-multiple: true }
      - name: Release notes (CHANGELOG section + how to flash)
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "**Try it without installing anything:** [MicroCS Studio](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/) in Chrome or Edge, connected to a board flashed with one of the files below."
            echo
            echo "| Board | File | How to flash |"
            echo "|---|---|---|"
            echo "| Raspberry Pi Pico / Pico 2 / Pico W / Pico 2 W / RP2040-Zero | \`microcs-$V-<board>.uf2\` | hold BOOTSEL, plug in, copy the file to the RPI-RP2 drive (\`pico_w\` / \`pico2_w\` files: Wi-Fi, sockets, HTTP client + server, WebSocket) |"
            echo "| ESP32 / S2 / S3 / C2 / C3 / C5 / C6 / C61 / H2 / P4 | \`microcs-$V-<chip>.bin\` | \`esptool.py --chip <chip> write_flash 0 microcs-$V-<chip>.bin\` |"
            echo "| STM32 Nucleo-F401RE / F411RE / F446RE / G474RE / L476RG / H743ZI | \`microcs-$V-nucleo_<board>.bin\` | copy the file to the NOD_xxx drive of the Nucleo's ST-LINK (or STM32CubeProgrammer, \`.hex\` keeps your files); the console is the ST-LINK virtual COM port |"
            echo "| STM32 Black Pill (F411CE) | \`microcs-$V-blackpill_f411ce.bin\` | USB DFU (hold BOOT0, reset): \`dfu-util -a 0 -s 0x08000000:leave -D microcs-$V-blackpill_f411ce.bin\`, or ST-LINK; console = USART1 (PA9 TX, PA10 RX) via a USB-serial adapter |"
            echo "| Linux x64 | \`mcs-$V-<os>.tar.gz\` | compiler, REPL and simulator: \`./mcs --repl --sim\` |"
            echo "| Threads | | Pico / Pico 2 / RP2040-Zero and ESP32 files run FreeRTOS (SMP on dual cores): \`Thread.RunOn(1, …)\` and \`jobs.cfg\` jobs use real threads; STM32 files are bare-metal |"
            echo "| Radios | | ESP32: Wi-Fi + ESP-NOW and BLE where the chip supports them. S2: Wi-Fi + ESP-NOW only; H2: BLE only; P4: neither onboard radio. Pico W / Pico 2 W: Wi-Fi. Radios start when used by a script (or saved Wi-Fi autoconnect). |"
            echo "| ESP32 storage migration | | Radio-enabled images use a larger app partition than the old no-Wi-Fi releases. Back up scripts before flashing: the storage partition moves and old files are not preserved. |"
            echo "| ESP32-C2 note | | built for a 40 MHz crystal (ESP-IDF default); boards with a 26 MHz ESP8684 need a rebuild with \`CONFIG_XTAL_FREQ_26=y\` |"
            echo "| Arduino IDE | \`MicroCS-$V.zip\` | Sketch → Include Library → Add .ZIP Library |"
            echo
            awk -v v="## $V" 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md
          } > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.version.outputs.version }}
        run: |
          title=$(grep -m1 "^## $V" CHANGELOG.md | sed 's/^## //')
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "v$V" release-files/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v$V" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            exit 0
          fi
          gh release create "v$V" release-files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MicroCS ${title:-$V}" --notes-file notes.md
